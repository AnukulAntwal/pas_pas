<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #020617, #071227);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #555;
    }

    .input-group input,
    .input-group textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
    }

    textarea {
        resize: none;
        height: 120px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #3e75ed;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #43bbcd;
    }

    .footer-text {
        text-align: center;
        margin-top: 10px;
        font-size: 12px;
        color: #777;
    }

    .date-group {
        margin-top: -10px;
        margin-bottom: 5px;
        text-align: right;
    }

    .date-text {
        font-size: 13px;
        color: #aaa;
    }
    .response-box {
    display: none;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    animation: fadeIn 0.5s ease;
}

.response-box.success {
    background-color: #e6f9ec;
    color: #2e7d32;
    border: 1px solid #b7e4c7;
}

.response-box.error {
    background-color: #fdecea;
    color: #c62828;
    border: 1px solid #f5c6cb;
}
.platform {
        text-align: center;
        font-size: clamp(12px, 3vw, 13px);
        color: #888;
        margin-bottom: 10px;
    }
    .date-display {
        text-align: center;
        font-size: clamp(12px, 3vw, 13px);
        color: #bbb;
        margin-bottom: 15px;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Contact Us</h2>
    <div class="platform">
        PasPas Support
    </div>

    <div class="date-display" id="currentDate"></div>
    <!-- ✅ FORM -->
    <form id="contactForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="full_name" placeholder="Enter your name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Subject</label>
            <input type="text" name="subject" placeholder="Subject">
        </div>

        <div class="input-group">
            <label>Message</label>
            <textarea name="message" placeholder="Write your message in detail..." required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

    <div class="footer-text" id="responseMsg" class="response-box">
        We'll get back to you soon.
    </div>
</div>

<script>
    // ✅ Show date
    const today = new Date();
    const options = { day: '2-digit', month: 'long', year: 'numeric' };
    document.getElementById("currentDate").innerText =
        today.toLocaleDateString('en-US', options);

    // ✅ Submit form
    document.getElementById("contactForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const form = e.target;

        const data = {
            full_name: form.full_name.value,
            email: form.email.value,
            subject: form.subject.value,
            message: form.message.value
        };

        // 🔥 dynamic base URL
        const BASE_URL = window.location.origin;

        try {
            const res = await fetch(`${BASE_URL}/api/contact-us/save`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            const msgBox = document.getElementById("responseMsg");
            
            if (res.ok) {
            msgBox.className = "response-box success";
            msgBox.innerText = "Thank you for your submission. We will get back to you shortly.”.";
            msgBox.style.display = "block";
            form.reset();
            } else {
            msgBox.className = "response-box error";
            msgBox.innerText = result.message || "Something went wrong. Please try again.";
            msgBox.style.display = "block";
            }

        } catch (error) {
            const msgBox = document.getElementById("responseMsg");
            msgBox.className = "response-box error";
            msgBox.innerText = "Unable to submit your request. Please try again later.";
            msgBox.style.display = "block";
        }
    });
</script>

</body>
</html>
